name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package
        run: .\package.cmd
        shell: cmd

      - name: Test server updater
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/updater-tests.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PxToolkit-x64
          path: build/PxToolkit-*-win-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME build/PxToolkit-*-win-x64.zip --verify-tag --title "Paradox Modding Toolkit $env:GITHUB_REF_NAME" --notes-file release-notes.md

permissions:
  contents: write
